name: Release webui-sectium (4-OS zig cc)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Test C11 sectium_pipe transport
        run: |
          zig cc -std=c11 -Os -s -Wall -Wextra -Werror -Iinclude \
            src/b8g_webui_sectium.c src/b8g_webui_sectium_test.c \
            -o /tmp/b8g_webui_sectium_test
          /tmp/b8g_webui_sectium_test

      - name: Cross-compile 4-OS stripped libraries
        run: |
          mkdir -p dist
          zig cc -std=c11 -Os -s -Wall -Wextra -Werror -DB8G_WEBUI_BUILD_DLL -shared -Iinclude \
            -target x86_64-windows-gnu src/b8g_webui_sectium.c \
            -o dist/libwebui-sectium-windows-x64.dll
          zig cc -std=c11 -Os -s -Wall -Wextra -Werror -shared -fPIC -Iinclude \
            -target x86_64-linux-musl src/b8g_webui_sectium.c \
            -o dist/libwebui-sectium-linux-x64.so
          zig cc -std=c11 -Os -s -Wall -Wextra -Werror -shared -fPIC -Iinclude \
            -target aarch64-linux-musl src/b8g_webui_sectium.c \
            -o dist/libwebui-sectium-linux-arm64.so
          zig cc -std=c11 -Os -s -Wall -Wextra -Werror -shared -fPIC -Iinclude \
            -target aarch64-macos src/b8g_webui_sectium.c \
            -o dist/libwebui-sectium-darwin-arm64.dylib
          cp include/b8g_webui_sectium.h dist/b8g_webui_sectium.h
          (
            cd dist
            sha256sum libwebui-sectium-* b8g_webui_sectium.h > SHA256SUMS.txt
            sha512sum libwebui-sectium-* b8g_webui_sectium.h > SHA512SUMS.txt
          )
          ls -la dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "awesome-os/webui ${TAG} (sectium_pipe)" \
              --notes "Zero-HTTP Sectium named-pipe transport (\`\\\\.\\pipe\\sectium-dev\` / \`/tmp/sectium-dev.sock\`, \`B8G_ABI_MAGIC_V3 = 0x33564742\`). Built natively in C11 with \`zig cc -std=c11 -Os -s\`."
          fi
